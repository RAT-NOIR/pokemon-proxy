# Les imports Cardmarket quotidiens (guide des prix 04:47 UTC, catalogue 12:17 UTC) — décision du testeur, 2026-10-17.
# Minutes NON rondes (GitHub fait glisser les crons à l'heure pile : 4 h 20 de retard le 2026-10-18) et un passage de secours 2 h après
# chacun (06:47, 14:17) : la MÊME passe `auto`, sans code propre — elle ne fait rien si l'import du jour est déjà en base (journal).
# Appelle le MÊME module que l'ancien worker (collecte-cartes/imports-quotidiens.js) via imports-cardmarket-ci.js.
# Un import en échec = job rouge = courriel GitHub au propriétaire. Secrets du dépôt : MONGODB_URI_IMPORTS, R2_BUCKET_BRUT,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID (aucune valeur dans ce fichier).
name: imports-cardmarket

on:
  schedule:
    - cron: '47 4 * * *'
    - cron: '47 6 * * *'
    - cron: '17 12 * * *'
    - cron: '17 14 * * *'
  workflow_dispatch:
    inputs:
      import:
        description: 'Quel import (auto = ce que l heure et le journal rendent dû)'
        type: choice
        default: auto
        options:
          - auto
          - guide
          - catalogue

permissions:
  contents: read

concurrency:
  group: imports-cardmarket
  cancel-in-progress: false

jobs:
  importer:
    # Ubuntu FIXÉ (ubuntu-latest passe à Ubuntu 26 : décision du testeur, 2026-10-24, de ne pas suivre le glissement en silence)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Épinglées sur le SHA de l'étiquette, vérifié le 2026-10-24 (action.yml lu par ce SHA : `using: node24`) :
      # checkout v7.0.1 (publiée le 2026-07-20), setup-node v7.1.0 (publiée le 2026-10-08)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Installer les dépendances (reproductible, node_modules n'est pas suivi)
        run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Passe d'import
        run: node imports-cardmarket-ci.js --import="$IMPORT_CHOIX"
        env:
          IMPORT_CHOIX: ${{ inputs.import || 'auto' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI_IMPORTS }}
          R2_BUCKET_BRUT: ${{ secrets.R2_BUCKET_BRUT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

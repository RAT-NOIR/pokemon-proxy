# Les imports Cardmarket quotidiens (guide des prix 05:00 UTC, catalogue 12:15 UTC) — décision du testeur, 2026-10-17.
# Appelle le MÊME module que l'ancien worker (collecte-cartes/imports-quotidiens.js) via imports-cardmarket-ci.js.
# Un import en échec = job rouge = courriel GitHub au propriétaire. Secrets du dépôt : MONGODB_URI_IMPORTS, R2_BUCKET_BRUT,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID (aucune valeur dans ce fichier).
name: imports-cardmarket

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '15 12 * * *'
  workflow_dispatch:
    inputs:
      import:
        description: 'Quel import (auto = ce que l heure et le journal rendent dû)'
        type: choice
        default: auto
        options:
          - auto
          - guide
          - catalogue

permissions:
  contents: read

concurrency:
  group: imports-cardmarket
  cancel-in-progress: false

jobs:
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances (reproductible, node_modules n'est pas suivi)
        run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Passe d'import
        run: node imports-cardmarket-ci.js --import="$IMPORT_CHOIX"
        env:
          IMPORT_CHOIX: ${{ inputs.import || 'auto' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI_IMPORTS }}
          R2_BUCKET_BRUT: ${{ secrets.R2_BUCKET_BRUT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
